{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Upload a File</h1>
  <p class="lede">The file is hashed with SHA-256, replicated across 3 independent storage nodes, and recorded as a new block in the blockchain ledger.</p>
  <form method="POST" enctype="multipart/form-data">
    <div class="form-row"><input type="file" name="file" required></div>
    <button type="submit">Upload file</button>
  </form>
</div>
{% endblock %}
