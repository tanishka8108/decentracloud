{% extends "base.html" %}
{% block content %}
<div class="card auth-shell">
  <h1>Welcome back</h1>
  <p class="lede">Log in to view, share and verify your files.</p>
  <form method="POST">
    <div class="form-row"><input name="username" placeholder="Username" required></div>
    <div class="form-row"><input name="password" type="password" placeholder="Password" required></div>
    <button type="submit" style="width:100%;">Log in</button>
  </form>
  <p class="muted-note">No account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
