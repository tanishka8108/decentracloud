{% extends "base.html" %}
{% block content %}
<div class="card auth-shell">
  <h1>Create an account</h1>
  <p class="lede">Your identity is recorded on the ledger the moment you register.</p>
  <form method="POST">
    <div class="form-row"><input name="username" placeholder="Choose a username" required></div>
    <div class="form-row"><input name="password" type="password" placeholder="Choose a password" required></div>
    <button type="submit" style="width:100%;">Register</button>
  </form>
  <p class="muted-note">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
